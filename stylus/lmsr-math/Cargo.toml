[package]
name = "lmsr-math"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "LMSR cost and prices with PRBMath-exact fixed-point exp/ln, as an Arbitrum Stylus contract"

[dependencies]
stylus-sdk = "0.10.9"
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]
contract-client-gen = []

[[bin]]
name = "lmsr-math"
path = "src/main.rs"

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"
